name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # storia completa: build-sitemap.py legge <lastmod> da `git log`,
          # con il checkout shallow di default vedrebbe un solo commit
          fetch-depth: 0

      - name: Rigenera sitemap.xml
        run: python3 tools/build-sitemap.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Avvisa Bing, Yandex, Naver, Seznam e Yep delle pagine cambiate.
      # Google non aderisce a IndexNow: per lui contano sitemap e <lastmod>.
      # Gira dopo il deploy, altrimenti i motori leggono la versione vecchia.
      # continue-on-error: una notifica fallita non deve far fallire il deploy.
      - name: Notifica IndexNow
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD~1..HEAD"   # primo push del branch o force-push
          else
            RANGE="$BEFORE..$AFTER"
          fi
          echo "range: $RANGE"
          python3 tools/indexnow.py --range "$RANGE"

      # Reinvia la sitemap a Search Console. Non forza una scansione: e' il
      # pulsante "Invia" della UI, niente di piu'. La leva vera resta il
      # <lastmod> corretto che scrive build-sitemap.py.
      # Salta da solo finche' il secret non e' configurato.
      # Gira anche su avvio manuale: non dipende da un range git, quindi e'
      # utile poterlo rilanciare a mano senza fabbricare un commit.
      - name: Reinvia sitemap a Search Console
        continue-on-error: true
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            echo "secret GSC_SERVICE_ACCOUNT_JSON non configurato: salto"
            exit 0
          fi
          pip install --quiet google-auth
          python3 tools/gsc-submit-sitemap.py
